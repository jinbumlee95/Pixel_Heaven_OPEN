<script type="module">
const items=JSON.parse(document.querySelector('#asset-data').textContent);
let running=true,time=0,previous=performance.now();const cards=[];const z=()=>Number(document.querySelector('#zoom').value);
async function img(path){const im=new Image();im.src=path;await im.decode();return im;}
const sideBadges=await img('ui/combat/side_badges.png');
for(const item of items){const card=document.createElement('article');card.className='card';const title=document.createElement('h2');title.textContent=item.name;const stage=document.createElement('div');stage.className='stage';card.append(title,stage);document.querySelector('#grid').append(card);
try{if(item.kind==='static'){const im=await img(item.path);im.alt=item.name;im.width=item.width*z();im.height=item.height*z();stage.append(im);cards.push({static:true,im,item});}
else if(item.kind==='sheet'){const im=await img(item.path),c=document.createElement('canvas');stage.append(c);cards.push({c,im,item});}
else{const m=item.metadata,select=document.createElement('select');select.setAttribute('aria-label',item.name+' 동작');for(const name of Object.keys(m.paths)){const o=document.createElement('option');o.value=name;o.textContent=name;select.append(o);}card.insertBefore(select,stage);const images={};for(const [k,p]of Object.entries(m.paths))images[k]=await img('../'+p);for(let d=0;d<m.directionOrder.length;d++){const c=document.createElement('canvas');c.setAttribute('aria-label',m.directionOrder[d]);stage.append(c);cards.push({c,item,m,select,images,d});}}
const detail=document.createElement('small');detail.textContent=item.kind==='character'?'발 pivot '+JSON.stringify(item.metadata.pivot):item.width+' × '+item.height+'px';card.append(detail);
}catch(e){card.append('미납품/오류: '+e.message);}}
document.querySelector('#status').textContent=' · '+items.length+'개 항목';
function frame(now){if(running)time+=Math.min(100,now-previous);previous=now;const scale=z();for(const q of cards){if(q.static){q.im.width=q.item.width*scale;q.im.height=q.item.height*scale;continue;}const w=q.m?.frameDimensions.width??q.item.frameWidth,h=q.m?.frameDimensions.height??q.item.frameHeight;q.c.width=w*scale;q.c.height=h*scale;const ctx=q.c.getContext('2d');ctx.imageSmoothingEnabled=false;let im,row=0,col;
if(q.m){const name=q.select.value,count=q.m.frameCounts[name],ms=q.m.frameDurationsMs[name]??120;im=q.images[name];row=(name==='walk'?q.m.walkRows?.[q.m.directionOrder[q.d]]:undefined)??q.m.actionRows?.[q.m.directionOrder[q.d]]??q.d;col=Math.floor((time%(count*ms+(name==='walk'?0:700)))/ms);col=Math.min(count-1,col);}else{im=q.im;const f=Math.floor(time/q.item.duration)%q.item.frames,cols=im.width/w;row=Math.floor(f/cols);col=f%cols;}ctx.drawImage(im,col*w,row*h,w,h,0,0,w*scale,h*scale);if(q.m?.assetId.startsWith('combat.')){const side=q.m.assetId.includes('.enemy.')?1:0;ctx.drawImage(sideBadges,side*16,0,16,16,(w-16)*scale,0,16*scale,16*scale);}if(q.m){ctx.fillStyle='#daebdc';ctx.fillRect(q.m.pivot.x*scale-2,q.m.pivot.y*scale,5,1);}}
requestAnimationFrame(frame);}requestAnimationFrame(frame);
document.querySelector('#pause').onclick=e=>{running=!running;e.target.textContent=running?'일시정지':'재생';};document.querySelector('#bg').onchange=e=>document.documentElement.style.setProperty('--bg',e.target.value);document.querySelector('#gray').onchange=e=>document.body.classList.toggle('gray',e.target.checked);
</script></html>
